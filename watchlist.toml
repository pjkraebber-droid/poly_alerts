# Who to follow, and when to ping your phone.
#
# wallet = the 0x… address from a trader's Polymarket profile (or from the scout report).
# Soccer markets are ALWAYS skipped. That's built into the code and can't be switched off here.

[alerts]
# Ping when one trader puts at least this many dollars into one market.
# Small fills are added together, so a $50K order split into 500 pieces still counts as $50K.
min_bet_usd = 1000

# Also ping when they sell (take profit or exit). Useful if you copied the entry.
include_sells = true

# Each trader below is in a group:
#   group = "events"  -> alerts only on politics, economics and world-news bets
#   group = "sports"  -> alerts only on NON-soccer sports bets (NBA, NFL, college, MLB, NHL...)
# Soccer is blocked for every group and can't be switched on.
# block_all_sports only applies to traders with no group set.
block_all_sports = true

# The daily recap lists every move of at least this size from the last 24 hours.
digest_min_usd = 500

timezone = "America/New_York"
ntfy_server = "https://ntfy.sh"


