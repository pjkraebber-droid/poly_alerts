name: Whale alerts

on:
  schedule:
    - cron: "3-58/5 * * * *"   # every 5 minutes, off the busy :00 mark (GitHub can still run these a few minutes late)
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: read

concurrency:
  group: whale-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The tracker's memory (which trades it has already seen) lives in the
      # Actions cache, so it doesn't add a commit to your repo every 5 minutes.
      - name: Restore tracker memory
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: whale-state-${{ github.run_id }}
          restore-keys: whale-state-

      - name: Check watchlist and send alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_EVENTS: ${{ secrets.TELEGRAM_CHAT_EVENTS }}
          TELEGRAM_CHAT_SPORTS: ${{ secrets.TELEGRAM_CHAT_SPORTS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: python whalewatch.py run

      - name: Save tracker memory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: whale-state-${{ github.run_id }}-${{ github.run_attempt }}
