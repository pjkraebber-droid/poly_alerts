name: Keep schedule alive

# GitHub pauses scheduled workflows in public repos after 60 days with no
# commits. This makes one empty commit a month so the alerts never stop.

on:
  schedule:
    - cron: "17 14 1 * *"   # 1st of each month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Monthly keepalive"
          git push
