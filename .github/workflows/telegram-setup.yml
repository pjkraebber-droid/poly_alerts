name: Telegram setup

# Run this by hand after creating your bot (Actions tab -> Telegram setup -> Run workflow).
# Checks the bot token and chat ID step by step (results show as notes on the run page,
# with IDs shortened) and sends a test message to every chat you've saved as a secret.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the Telegram setup and send a test message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT_EVENTS: ${{ secrets.TELEGRAM_CHAT_EVENTS }}
          TELEGRAM_CHAT_SPORTS: ${{ secrets.TELEGRAM_CHAT_SPORTS }}
        run: python whalewatch.py doctor
